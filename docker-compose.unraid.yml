# Standalone deployment file, NOT an override of docker-compose.yml.
# Copy to /mnt/user/docker/palablras/docker-compose.yml alongside a copy of .env.
# The historical folder spelling is cosmetic; container and DNS names are palabras.
name: palabras
services:
  palabras:
    image: palabras:local
    build:
      context: /mnt/user/repos/palabras
      dockerfile: Dockerfile
    container_name: palabras
    ports:
      # Host checks only. NPM uses container DNS over sieben, never this port.
      - "127.0.0.1:${APP_PORT:-18480}:${APP_PORT:-18480}"
    environment:
      ASPNETCORE_URLS: "http://+:${APP_PORT:-18480}"
    volumes:
      - "${APPDATA_PATH:?Set APPDATA_PATH to /mnt/cache/appdata/palabras in .env}:/data"
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:${APP_PORT:-18480}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      sieben:
        aliases:
          - palabras
networks:
  sieben:
    external: true
