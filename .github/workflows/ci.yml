name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Bound the whole job: a container that accepts TCP but never answers the healthcheck
    # cannot stall a step for the 6 h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            tools/council/package-lock.json
      - run: dotnet restore Backend/Palabras.slnx
      - run: dotnet build Backend/Palabras.slnx --no-restore -c Release
      - run: dotnet test Backend/Palabras.slnx --no-build -c Release
      - run: npm ci
        working-directory: Frontend
      - run: npm run lint
        working-directory: Frontend
      - run: npm run build
        working-directory: Frontend
      # node --test suite (16 *.test.mjs files) - the module-level coverage the browser
      # suites never had. It runs after `npm run build` because pwa.test.mjs inspects the
      # emitted dist/ for the PWA assets, and before the artifact upload so a unit failure
      # stops the job before anything is published.
      - name: Run frontend unit tests
        working-directory: Frontend
        run: npm test
      # The browser job runs the Playwright suite against this exact bundle, so it is
      # published here - before the container step - instead of being rebuilt there.
      - name: Publish frontend bundle for the browser job
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist
          retention-days: 1
          if-no-files-found: error
      # Content gate: validates content/words/*.json against the schema and the
      # peninsular-vs-LatAm lexicon. Zero dependencies, so no install is needed.
      - name: Lint content
        run: node tools/content-lint/index.js
      # Proves the council mode rejects a deliberately broken bundle, over the same fixtures the
      # C# validator and the CLI use. Committed bundles themselves were linted by the step above.
      - name: Lint council bundle fixtures
        run: node tools/content-lint/candidates.js --self-test
      # Offline producer: pretest builds; replay tests need no keys or network.
      - name: Council CLI (build and unit tests)
        working-directory: tools/council
        run: |
          npm ci
          npm test
      # Optional hash-only defence-in-depth; never reads local terms. An empty committed list is a
      # supported state: the guard prints a NOTICE and passes, because publishing hashes is an owner
      # decision. Unparsable JSON, a missing/unknown version, any plaintext term, one hash with two
      # token counts, or a malformed hash still fails closed.
      - name: Council committed privacy hash guard
        working-directory: tools/council
        run: npm run privacy:check
      # E.0 source half: no provider hostname or SDK marker may be reachable from the app's own
      # source. The offline council CLI lives under tools/ and is never copied into the image.
      - name: E.0 no LLM in the app source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'api\.openai\.com|api\.anthropic\.com|generativelanguage\.googleapis\.com|openrouter\.ai|@ai-sdk' \
            --include='*.cs' --include='*.ts' --include='*.tsx' --include='*.js' Backend Frontend/src; then
            echo 'FAIL E.0: provider endpoint or SDK marker in app source'; exit 1
          fi
          echo 'E.0 source guard OK'
      - name: Build and smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t palabras:ci --build-arg COMMIT_SHA="$GITHUB_SHA" .
          docker run -d --name palabras-ci-smoke -p 127.0.0.1:18480:18480 palabras:ci
          base=http://127.0.0.1:18480
          request=(curl --silent --show-error --connect-timeout 2 --max-time 5)
          status_of() { "${request[@]}" -o /dev/null -w '%{http_code}' "$base$1"; }
          body_of() { "${request[@]}" "$base$1"; }
          expect_status() { # path expected-status
            actual=$(status_of "$1")
            [[ "$actual" == "$2" ]] || { echo "FAIL $1: expected $2, got $actual"; exit 1; }
          }
          # Readiness is the health body, not the open socket.
          body=$(curl --retry-all-errors --retry 30 --retry-delay 1 --fail "$base/healthz")
          [[ "$body" == *'"status":"ok"'* ]] || { echo "FAIL /healthz body: $body"; exit 1; }
          # The build arg must actually reach the assembly: a smoke test on a stale or empty
          # identity would pass while the deploy host had no way to tell builds apart.
          [[ "$body" == *"\"commit\":\"$GITHUB_SHA\""* ]] || { echo "FAIL /healthz commit: $body"; exit 1; }

          # Anonymous requests are challenged before routing, so the challenge owns the
          # contract: /api/* answers 401 with the JSON error shape, everything else is
          # redirected to the login page carrying the original path.
          expect_status /api/nope 401
          api_body=$(body_of /api/nope)
          [[ "$api_body" == '{"error":"unauthorized"}' ]] || { echo "FAIL /api/nope body: $api_body"; exit 1; }
          redirect=$(curl --silent --show-error --connect-timeout 2 --max-time 5 -o /dev/null -w '%{redirect_url}' "$base/anything")
          [[ "$redirect" == *'/login?ReturnUrl=%2Fanything' ]] || { echo "FAIL /anything redirect: $redirect"; exit 1; }

          # Public-route 200 anchors: the SPA document still answers without a session, and a
          # real static asset is served as itself rather than as a fallback document.
          expect_status /login 200
          document=$(body_of /login)
          [[ "$document" == *'<div id="root">'* ]] || { echo "FAIL /login document: ${document:0:200}"; exit 1; }
          expect_status /offline.htm 200

          # Authenticated contract. The anonymous probes above say nothing about what a
          # signed-in caller reaches, so seed one account with the app's own CLI (the same
          # binary, `user create`, driven by UserCli) and log in for real. The password only
          # travels on stdin and in the login body - never in argv, never printed.
          jar=$(mktemp)
          login_out=$(mktemp)
          password=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
          docker exec -i palabras-ci-smoke dotnet Palabras.dll user create owner \
            --username ci-owner --password-stdin <<<"$password" > /dev/null
          login_body="{\"username\":\"ci-owner\",\"password\":\"$password\"}"
          # The body goes in on stdin, so the password never reaches the curl argv.
          login_status=$(curl --silent --show-error --connect-timeout 2 --max-time 5 \
            -X POST -H 'Content-Type: application/json' -H 'X-Palabras: 1' \
            -c "$jar" -o "$login_out" -w '%{http_code}' --data @- \
            <<<"$login_body" "$base/api/auth/login")
          [[ "$login_status" == 200 ]] || { echo "FAIL /api/auth/login: expected 200, got $login_status $(cat "$login_out")"; exit 1; }
          # The session cookie is read back out of the jar curl wrote. Sending it explicitly
          # keeps the gate independent of curl's Secure-cookie replay policy over plain http
          # (the __Host- prefix makes the cookie Secure), while still proving that the login
          # really did populate a cookie jar.
          cookie=$(awk '$6 == "__Host-palabras" { print $6 "=" $7 }' "$jar")
          [[ "$cookie" == __Host-palabras=?* ]] || { echo "FAIL login cookie jar: no __Host-palabras entry in $jar"; exit 1; }

          expect_auth_status() { # path expected-status
            actual=$(curl --silent --show-error --connect-timeout 2 --max-time 5 -o /dev/null \
              -w '%{http_code}' -H "Cookie: $cookie" "$base$1")
            [[ "$actual" == "$2" ]] || { echo "FAIL (authenticated) $1: expected $2, got $actual"; exit 1; }
          }
          # An authenticated caller is routed instead of challenged: an unknown /api/* path
          # reaches the JSON 404 fallback (never the anonymous 401), and real learner routes
          # answer 200 for the owner account, which carries the learner role.
          expect_auth_status /api/nope 404
          auth_body=$(curl --silent --show-error --connect-timeout 2 --max-time 5 -H "Cookie: $cookie" "$base/api/nope")
          [[ "$auth_body" == '{"error":"not_found"}' ]] || { echo "FAIL (authenticated) /api/nope body: $auth_body"; exit 1; }
          expect_auth_status /api/auth/me 200
          expect_auth_status /api/learn/words 200
          # A protected SPA route is served as the document once signed in: 200, not the 302 above.
          expect_auth_status /sesion 200
      # E.0 hard invariant (design ΔE.0): the runtime image has no LLM dependency. Three checks on
      # the image the smoke step already built: no keys/LLM env, no provider hostnames or SDK
      # markers in binaries/wwwroot, and no council tooling or raw provider payloads on disk.
      # Deliberately scoped to binaries + wwwroot: content/council carries model ids such as
      # "anthropic:claude-..." as data, and the manifest is not code.
      - name: E.0 no LLM in the image
        shell: bash
        run: |
          set -euo pipefail
          # 1. No key or LLM-related variable in the container environment.
          env_hits=$(docker run --rm --entrypoint env palabras:ci | grep -Eic 'openai|anthropic|gemini|openrouter|api_key' || true)
          if [[ "$env_hits" != "0" ]]; then
            echo "FAIL E.0 env: $env_hits matching variable(s)"
            docker run --rm --entrypoint env palabras:ci | grep -Ei 'openai|anthropic|gemini|openrouter|api_key' || true
            exit 1
          fi
          # 2. No provider endpoint or SDK marker in the app binaries or the web root.
          if docker run --rm --entrypoint sh palabras:ci -c \
            "grep -a -E 'api\\.openai\\.com|api\\.anthropic\\.com|generativelanguage\\.googleapis\\.com|openrouter\\.ai|@ai-sdk' -r /app/*.dll /app/wwwroot"; then
            echo 'FAIL E.0 binaries: provider endpoint or SDK marker found'
            exit 1
          fi
          # 3. No council tooling, no env files, no raw provider payloads. The council directory
          #    itself must exist: it is the startup sync's default location.
          docker run --rm --entrypoint sh palabras:ci -c '
            set -e
            test ! -e /app/tools
            test -d /app/content/council
            ! find /app -name ".env*" -print -quit | grep -q .
            ! find /app/content/council -type d -name raw -print -quit | grep -q .
          '
          echo 'E.0 OK: no LLM runtime, keys or council tooling in palabras:ci'
      - name: Container logs and cleanup
        if: always()
        run: |
          if docker container inspect palabras-ci-smoke > /dev/null 2>&1; then
            docker logs palabras-ci-smoke || true
            docker rm -f palabras-ci-smoke
          fi
  browser:
    # Real gate for the browser and Service Worker suites. `npm run test:browser` is the one
    # piece of coverage the build job never had, which is how a broken sw-navigation.mjs
    # stayed invisible on main. A failing test fails this job; there is no continue-on-error.
    runs-on: ubuntu-latest
    needs: build
    # Still runs when the build job fails at the container step: the bundle this job consumes
    # was published earlier in that job, and the browser suite is an independent signal.
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    # Pinned to the tag whose bundled Chromium matches the lockfile's @playwright/test
    # 1.64.1 exactly, and which carries the Chromium system libraries. `latest` would drift
    # the browser out of step with the driver.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # The Playwright image requires a large /dev/shm: Chromium renders through it and the
      # 64 MB Docker default can crash a page. This is the documented invocation and it
      # removes a whole class of intermittent browser failures.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # Node 24 is the floor in Frontend/package.json (`>=24.21.0 <25`); the image's own Node
      # is pinned to the same version so `npm ci` and the suites never run on a runner default.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      # The suites serve the bundle the build job produced through `vite preview`, so they need
      # the test toolchain (vite, @playwright/test) but no second frontend build.
      - run: npm ci
        working-directory: Frontend
      # The image carries the browsers for *its* driver build, but the driver actually used is
      # the one Frontend/package-lock.json resolves (`@playwright/test: ^1.64.1`). When those
      # two drift, every suite dies inside chromium.launch with
      # "Executable doesn't exist at /ms-playwright/chromium_headless_shell-<rev>". Installing
      # from the lockfile's own driver plus the Chromium system libraries makes the pairing
      # explicit and does not depend on the image tag staying in lockstep with the lockfile.
      - name: Install the locked Playwright Chromium and system dependencies
        working-directory: Frontend
        run: npm exec -- playwright install --with-deps chromium
      # Explicit ordering: the build job publishes Frontend/dist *before* this job starts
      # (needs: build), and nothing here rebuilds it. The layout is asserted once, right after
      # the download, so a changed artifact shape fails with a clear message instead of as a
      # missing-file error inside Playwright.
      - name: Download the bundle built by the build job
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist
      - name: Verify the downloaded bundle layout
        working-directory: Frontend
        run: |
          set -euo pipefail
          test -f dist/index.html && test -f dist/sw.js || {
            echo "FAIL: the frontend-dist artifact is not laid out at Frontend/dist"; exit 1; }
          echo "dist layout OK: index.html, sw.js"
      # One step per suite, each on its own PALABRAS_TEST_PORT. All four runners start
      # `vite preview` with strictPort, so distinct ports mean a suite can never inherit a
      # half-released listener from the suite before it (the old single `test:browser` run gave
      # browser.mjs and reviewBrowser.mjs the same 4173 and left sw-navigation.mjs on a
      # hard-coded 4174 that ignored the override entirely).
      # No suite is skipped or made non-blocking: every step is a hard gate.
      - name: Browser suite (browser.mjs)
        working-directory: Frontend
        env:
          PALABRAS_TEST_PORT: '4180'
        run: npm run test:browser:main
      - name: Service Worker navigation suite (sw-navigation.mjs)
        working-directory: Frontend
        env:
          PALABRAS_TEST_PORT: '4181'
        run: npm run test:sw:browser
      - name: Reviewer browser suite (reviewBrowser.mjs)
        working-directory: Frontend
        env:
          PALABRAS_TEST_PORT: '4182'
        run: npm run test:review:browser
      # Focused M7 day-status suite (dayBrowser.mjs -> learnBrowser/dayPanelBrowser): day panel,
      # acceptance flow and the panel harness, without the full browser suite above.
      - name: M7 day-status browser suite (dayBrowser.mjs)
        working-directory: Frontend
        env:
          PALABRAS_TEST_PORT: '4183'
        run: npm run test:day:browser
