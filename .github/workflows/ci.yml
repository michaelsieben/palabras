name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Bound the whole job: a container that accepts TCP but never answers the healthcheck
    # cannot stall a step for the 6 h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: dotnet restore Backend/Palabras.slnx
      - run: dotnet build Backend/Palabras.slnx --no-restore -c Release
      - run: dotnet test Backend/Palabras.slnx --no-build -c Release
      - run: npm ci
        working-directory: Frontend
      - run: npm run lint
        working-directory: Frontend
      - run: npm run build
        working-directory: Frontend
      - name: Build and smoke-test container
        shell: bash
        run: |
          docker build -t palabras:ci .
          docker run -d --name palabras-ci-smoke -p 127.0.0.1:18480:18480 palabras:ci
          body=$(curl --retry-all-errors --retry 30 --retry-delay 1 --connect-timeout 2 --max-time 5 --fail http://127.0.0.1:18480/healthz)
          [[ "$body" == *'"status":"ok"'* ]]
          [[ "$(curl --silent --show-error --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:18480/api/nope)" == "404" ]]
          [[ "$(curl --silent --show-error --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:18480/anything)" == "200" ]]
      - name: Container logs and cleanup
        if: always()
        run: |
          if docker container inspect palabras-ci-smoke > /dev/null 2>&1; then
            docker logs palabras-ci-smoke || true
            docker rm -f palabras-ci-smoke
          fi
