# Copy to /mnt/user/docker/palabras/docker-compose.yml; run from that directory.
# Standalone deployment file, not an override. Source stays in the repos share.
name: palabras
services:
  palabras:
    image: palabras:local
    build:
      context: /mnt/user/repos/palabras
      dockerfile: Dockerfile
      args:
        # Build identity (T-20261018-2105): the image must carry the sha it was built from.
        # deploy/unraid-deploy.sh exports COMMIT_SHA (the sha of the checkout it builds) before
        # `up -d --build`, and compose interpolates it here. The default keeps a hand-run
        # `docker compose up --build` without the export working: the build still succeeds and
        # the app reports commit/commitShort as "unknown" rather than a guessed sha.
        COMMIT_SHA: "${COMMIT_SHA:-unknown}"
    container_name: palabras
    ports:
      # Debug/host-health only; NPM reaches palabras:18480 over sieben.
      - "127.0.0.1:${APP_PORT:-18480}:${APP_PORT:-18480}"
    environment:
      ASPNETCORE_URLS: "http://+:${APP_PORT:-18480}"
    volumes:
      - "${APPDATA_PATH:?Set APPDATA_PATH to /mnt/cache/appdata/palabras in .env}:/data"
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:${APP_PORT:-18480}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      sieben:
        aliases:
          - palabras
networks:
  sieben:
    external: true
