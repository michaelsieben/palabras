services:
  palabras:
    image: palabras:local
    build: .
    ports: ["127.0.0.1:18480:8080"]
    volumes:
      - palabras-appdata:/data
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  palabras-appdata:
