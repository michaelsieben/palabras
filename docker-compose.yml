services:
  palabras:
    image: palabras:local
    build: .
    ports:
      # Host-side checks only. Unraid's proxy uses container DNS on `sieben`.
      # APP_PORT changes host and container port together.
      - "127.0.0.1:${APP_PORT:-18480}:${APP_PORT:-18480}"
    environment:
      # Keep the in-container listen port equal to the published port.
      ASPNETCORE_URLS: "http://+:${APP_PORT:-18480}"
    volumes:
      - "${APPDATA_PATH:-./data}:/data"
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:${APP_PORT:-18480}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
